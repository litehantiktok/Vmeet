<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#111318"
  >

  <title>VMeet</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>


<body>

  <!-- =========================
       TRANG CHÍNH
  ========================== -->

  <main
    id="home"
    class="home"
  >

    <div class="logo">
      <div class="logo-icon">V</div>

      <h1>VMeet</h1>
    </div>


    <p class="subtitle">
      Họp trực tuyến đơn giản
    </p>


    <input
      id="name"
      type="text"
      placeholder="Nhập tên của bạn"
      maxlength="40"
      autocomplete="name"
    >


    <button
      id="create"
      class="primary-btn"
    >
      ➕ Tạo cuộc họp mới
    </button>


    <p
      id="joinInfo"
      class="join-info hidden"
    >
      Bạn được mời tham gia cuộc họp
    </p>


    <button
      id="join"
      class="primary-btn hidden"
    >
      🚪 Tham gia cuộc họp
    </button>

  </main>



  <!-- =========================
       XEM TRƯỚC TRƯỚC KHI VÀO
  ========================== -->

  <main
    id="prejoin"
    class="prejoin hidden"
  >

    <div class="prejoin-container">

      <div class="prejoin-title">
        <strong>
          Tham gia VMeet
        </strong>

        <span id="prejoinRoom">
          Chuẩn bị tham gia cuộc họp
        </span>
      </div>


      <!-- CAMERA XEM TRƯỚC -->

      <div class="preview-video-box">

        <video
          id="previewVideo"
          autoplay
          muted
          playsinline
        ></video>


        <div
          id="cameraOffOverlay"
          class="camera-off-overlay hidden"
        >
          <div class="camera-off-icon">
            📷
          </div>

          <span>
            Camera đang tắt
          </span>
        </div>


        <div class="preview-name">
          <span id="previewName">
            Bạn
          </span>
        </div>

      </div>


      <!-- ĐIỀU KHIỂN -->

      <div class="prejoin-controls">

        <button
          id="previewMic"
          class="preview-control active"
          type="button"
        >
          <span class="preview-icon">
            🎤
          </span>

          <span>
            Mic
          </span>
        </button>


        <button
          id="previewCam"
          class="preview-control active"
          type="button"
        >
          <span class="preview-icon">
            📷
          </span>

          <span>
            Camera
          </span>
        </button>


        <button
          id="previewSwitchCamera"
          class="preview-control"
          type="button"
        >
          <span class="preview-icon">
            🔄
          </span>

          <span>
            Đổi cam
          </span>
        </button>

      </div>


      <!-- NÚT THAM GIA -->

      <button
        id="prejoinEnter"
        class="prejoin-enter"
        type="button"
      >
        🚪 Tham gia cuộc họp
      </button>


      <button
        id="prejoinBack"
        class="prejoin-back"
        type="button"
      >
        ← Quay lại
      </button>

    </div>

  </main>



  <!-- =========================
       PHÒNG HỌP
  ========================== -->

  <main
    id="meeting"
    class="meeting hidden"
  >


    <!-- =======================
         HEADER
    ======================== -->

    <header class="meeting-header">


      <div class="header-info">

        <strong>
          VMeet
        </strong>

        <span id="roomTitle">
          Phòng
        </span>

      </div>


      <div class="header-actions">

        <button
          id="copy"
          class="header-btn"
          aria-label="Mời người tham gia"
        >
          🔗
        </button>


        <button
          id="participantsBtn"
          class="header-btn"
          aria-label="Người tham gia"
        >
          👥
        </button>

      </div>

    </header>



    <!-- =======================
         KHU VỰC VIDEO
    ======================== -->

    <section
      id="videos"
      class="videos"
    >


      <!-- VIDEO CHỦ PHÒNG / BẠN -->

      <div
        id="localTile"
        class="video-tile local-tile"
        data-user-id=""
      >

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>


        <div class="video-name">

          <span id="localName">
            Bạn
          </span>

          <span
            id="localHostBadge"
            class="host-badge hidden"
          >
            👑
          </span>

        </div>


        <!-- Nhãn ghim -->

        <div
          id="localPinnedBadge"
          class="pinned-badge hidden"
        >
          📌 Đã ghim
        </div>

      </div>

    </section>



    <!-- =======================
         CHAT
    ======================== -->

    <section
      id="chatPanel"
      class="chat-panel hidden"
    >

      <div class="chat-header">

        <strong>
          💬 Trò chuyện
        </strong>


        <button
          id="closeChat"
          class="close-btn"
          type="button"
        >
          ✕
        </button>

      </div>


      <div
        id="messages"
        class="messages"
      ></div>


      <form
        id="chatForm"
        class="chat-form"
      >

        <input
          id="chatInput"
          type="text"
          maxlength="500"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        >


        <button
          type="submit"
          class="send-btn"
        >
          Gửi
        </button>

      </form>

    </section>



    <!-- =======================
         BẢNG NGƯỜI THAM GIA
    ======================== -->

    <section
      id="participantsPanel"
      class="participants-panel hidden"
    >

      <div class="panel-header">

        <strong>
          👥 Người tham gia
        </strong>


        <button
          id="closeParticipants"
          class="close-btn"
          type="button"
        >
          ✕
        </button>

      </div>



      <!-- =====================
           ĐIỀU KHIỂN CHỦ PHÒNG
      ====================== -->

      <div
        id="hostControls"
        class="host-controls hidden"
      >

        <div class="host-title">
          👑 Điều khiển chủ phòng
        </div>


        <button
          id="pinHost"
          class="host-action"
          type="button"
        >
          📌 Ghim chủ phòng cho tất cả
        </button>


        <button
          id="muteAll"
          class="host-action"
          type="button"
        >
          🔇 Tắt mic tất cả
        </button>


        <button
          id="cameraOffAll"
          class="host-action"
          type="button"
        >
          📷 Tắt camera tất cả
        </button>


        <button
          id="unlockAllMic"
          class="host-action"
          type="button"
        >
          🎤 Cho phép bật mic
        </button>


        <button
          id="unlockAllCamera"
          class="host-action"
          type="button"
        >
          📷 Cho phép bật camera
        </button>


        <button
          id="lockRoom"
          class="host-action"
          type="button"
        >
          🔒 Khóa phòng
        </button>

      </div>



      <!-- =====================
           DANH SÁCH
      ====================== -->

      <div class="participants-content">

        <div class="list-title">
          Trong phòng
        </div>


        <div
          id="participantsList"
          class="participants-list"
        ></div>

      </div>

    </section>



    <!-- =======================
         THANH ĐIỀU KHIỂN
    ======================== -->

    <nav class="controls">

      <button
        id="mic"
        class="control-btn"
        type="button"
      >
        🎤
        <span>Mic</span>
      </button>


      <button
        id="cam"
        class="control-btn"
        type="button"
      >
        📷
        <span>Camera</span>
      </button>


      <button
        id="switchCamera"
        class="control-btn"
        type="button"
      >
        🔄
        <span>Đổi cam</span>
      </button>


      <button
        id="screen"
        class="control-btn"
        type="button"
      >
        🖥️
        <span>Chia sẻ</span>
      </button>


      <button
        id="chatBtn"
        class="control-btn"
        type="button"
      >
        💬
        <span>Chat</span>
      </button>


      <button
        id="leave"
        class="control-btn leave-btn"
        type="button"
      >
        📞
        <span>Rời phòng</span>
      </button>

    </nav>

  </main>



  <!-- =========================
       THÔNG BÁO
  ========================== -->

  <div
    id="toast"
    class="toast hidden"
  ></div>



  <!-- =========================
       SOCKET.IO
  ========================== -->

  <script
    src="/socket.io/socket.io.js"
  ></script>


  <!-- =========================
       APP
  ========================== -->

  <script
    src="app.js"
  ></script>


</body>

</html>
