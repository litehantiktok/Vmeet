<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMeet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TRANG CHÍNH -->
  <main id="home" class="container">

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>VMeet</h1>
    </div>

    <p class="subtitle">
      Họp trực tuyến đơn giản – không cần tải ứng dụng
    </p>

    <input
      id="name"
      type="text"
      placeholder="Nhập tên của bạn"
      autocomplete="name"
    >

    <button id="create" class="primary">
      ➕ Tạo cuộc họp mới
    </button>

    <div class="divider">
      <span>hoặc</span>
    </div>

    <input
      id="room"
      type="text"
      placeholder="Nhập mã phòng"
      autocomplete="off"
    >

    <button id="join">
      🚪 Xin vào cuộc họp
    </button>

  </main>


  <!-- MÀN HÌNH CHỜ DUYỆT -->
  <main id="waiting" class="container hidden">

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>VMeet</h1>
    </div>

    <div class="waiting-card">

      <div class="waiting-icon">
        ⏳
      </div>

      <h2>Đang chờ duyệt</h2>

      <p>
        Yêu cầu tham gia của bạn đã được gửi.
        Vui lòng chờ chủ phòng cho phép vào.
      </p>

      <div class="loader"></div>

      <button id="cancelWaiting">
        Hủy
      </button>

    </div>

  </main>


  <!-- PHÒNG HỌP -->
  <main id="meeting" class="meeting hidden">

    <!-- HEADER -->
    <header class="meeting-header">

      <div class="header-left">

        <strong>VMeet</strong>

        <span id="roomTitle"></span>

      </div>

      <div class="header-right">

        <button id="copy" class="small-btn">
          🔗 Mời
        </button>

        <button
          id="participantsBtn"
          class="small-btn"
        >
          👥 Người tham gia
        </button>

      </div>

    </header>


    <!-- VIDEO -->
    <section
      id="videos"
      class="videos"
    >

      <div class="video-tile local">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <span id="localName">
          Bạn
        </span>

      </div>

    </section>


    <!-- THANH ĐIỀU KHIỂN -->
    <nav class="controls">

      <button id="mic">
        🎤 Mic
      </button>

      <button id="cam">
        📷 Camera
      </button>

      <button id="switchCamera">
        🔄 Đổi camera
      </button>

      <button id="screen">
        🖥️ Chia sẻ
      </button>

      <button id="chatBtn">
        💬 Chat
      </button>

      <button
        id="leave"
        class="danger"
      >
        📞 Rời phòng
      </button>

    </nav>


    <!-- PANEL NGƯỜI THAM GIA -->
    <aside
      id="participantsPanel"
      class="side-panel hidden"
    >

      <div class="panel-header">

        <h3>
          👥 Người tham gia
        </h3>

        <button id="closeParticipants">
          ✕
        </button>

      </div>

      <!-- YÊU CẦU ĐANG CHỜ -->
      <div
        id="joinRequests"
        class="join-requests"
      >

        <h4>
          Yêu cầu tham gia
        </h4>

        <div id="requestsList">
        </div>

      </div>


      <!-- DANH SÁCH -->
      <div class="participants-list">

        <h4>
          Đang trong phòng
        </h4>

        <div id="participantsList">
        </div>

      </div>

    </aside>


    <!-- CHAT -->
    <aside
      id="chatPanel"
      class="chat hidden"
    >

      <div class="panel-header">

        <h3>
          💬 Trò chuyện
        </h3>

        <button id="closeChat">
          ✕
        </button>

      </div>

      <div
        id="messages"
        class="messages"
      ></div>

      <form id="chatForm">

        <input
          id="chatInput"
          type="text"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        >

        <button type="submit">
          Gửi
        </button>

      </form>

    </aside>

  </main>


  <!-- THÔNG BÁO -->
  <div
    id="toast"
    class="toast hidden"
  ></div>


  <!-- SOCKET.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
