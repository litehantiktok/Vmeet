<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VMeet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TRANG CHÍNH -->
  <main id="home" class="container">

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>VMeet</h1>
    </div>

    <p class="subtitle">
      Họp trực tuyến đơn giản – không cần tải ứng dụng
    </p>

    <input
      id="name"
      type="text"
      placeholder="Nhập tên của bạn"
      autocomplete="name"
    >

    <button id="create" class="primary">
      ➕ Tạo cuộc họp mới
    </button>

    <div class="divider">
      <span>hoặc</span>
    </div>

    <input
      id="room"
      type="text"
      placeholder="Nhập mã phòng"
      autocomplete="off"
    >

    <button id="join">
      🚪 Tham gia cuộc họp
    </button>

  </main>


  <!-- PHÒNG HỌP -->
  <main id="meeting" class="meeting hidden">

    <!-- HEADER -->
    <header class="meeting-header">

      <div>
        <strong>VMeet</strong>
        <span id="roomTitle"></span>
      </div>

      <button id="copy" class="small-btn">
        🔗 Mời
      </button>

    </header>


    <!-- VIDEO -->
    <section id="videos" class="videos">

      <div class="video-tile local">

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <span id="localName">
          Bạn
        </span>

      </div>

    </section>


    <!-- THANH ĐIỀU KHIỂN -->
    <nav class="controls">

      <button id="mic">
        🎤 Mic
      </button>

      <button id="cam">
        📷 Camera
      </button>

      <button id="switchCamera">
        🔄 Đổi camera
      </button>

      <button id="screen">
        🖥️ Chia sẻ
      </button>

      <button id="leave" class="danger">
        📞 Rời phòng
      </button>

    </nav>


    <!-- KHUNG CHAT -->
    <aside class="chat">

      <h3>💬 Trò chuyện</h3>

      <div id="messages" class="messages"></div>

      <form id="chatForm">

        <input
          id="chatInput"
          type="text"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        >

        <button type="submit">
          Gửi
        </button>

      </form>

    </aside>

  </main>


  <!-- SOCKET.IO -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
