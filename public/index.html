<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VMeet</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =========================
       TRANG CHÍNH
  ========================== -->

  <main
    id="home"
    class="container"
  >

    <div class="logo">
      <div class="logo-icon">V</div>
      <h1>VMeet</h1>
    </div>

    <p class="subtitle">
      Họp trực tuyến đơn giản
    </p>

    <input
      id="name"
      type="text"
      placeholder="Nhập tên của bạn"
      autocomplete="name"
    >

    <button
      id="create"
      class="primary"
    >
      ➕ Tạo cuộc họp mới
    </button>

    <p
      id="joinInfo"
      class="join-info hidden"
    >
      Bạn được mời tham gia cuộc họp
    </p>

    <button
      id="join"
      class="primary hidden"
    >
      🚪 Tham gia cuộc họp
    </button>

  </main>


  <!-- =========================
       PHÒNG HỌP
  ========================== -->

  <main
    id="meeting"
    class="meeting hidden"
  >

    <!-- HEADER -->

    <header class="meeting-header">

      <div class="header-left">

        <strong>VMeet</strong>

        <span id="roomTitle"></span>

      </div>

      <div class="header-right">

        <button
          id="copy"
          class="small-btn"
        >
          🔗 Mời
        </button>

        <button
          id="participantsBtn"
          class="small-btn"
        >
          👥 Người tham gia
        </button>

      </div>

    </header>


    <!-- =========================
         VIDEO
    ========================== -->

    <section
      id="videos"
      class="videos"
    >

      <div
        class="video-tile local"
        id="localTile"
      >

        <video
          id="localVideo"
          autoplay
          muted
          playsinline
        ></video>

        <span id="localName">
          Bạn
        </span>

      </div>

    </section>


    <!-- =========================
         ĐIỀU KHIỂN
    ========================== -->

    <nav class="controls">

      <button id="mic">
        🎤 Mic
      </button>

      <button id="cam">
        📷 Camera
      </button>

      <button id="switchCamera">
        🔄 Đổi camera
      </button>

      <button id="screen">
        🖥️ Chia sẻ
      </button>

      <button id="chatBtn">
        💬 Chat
      </button>

      <button
        id="leave"
        class="danger"
      >
        📞 Rời phòng
      </button>

    </nav>


    <!-- =========================
         QUẢN LÝ NGƯỜI THAM GIA
    ========================== -->

    <aside
      id="participantsPanel"
      class="side-panel hidden"
    >

      <div class="panel-header">

        <h3>
          👥 Người tham gia
        </h3>

        <button
          id="closeParticipants"
        >
          ✕
        </button>

      </div>


      <!-- CÁC NÚT CHỦ PHÒNG -->

      <div
        id="hostControls"
        class="host-controls hidden"
      >

        <h4>
          👑 Điều khiển phòng
        </h4>

        <button id="muteAll">
          🔇 Tắt mic tất cả
        </button>

        <button id="cameraOffAll">
          📷 Tắt camera tất cả
        </button>

        <button id="unlockAllMic">
          🎤 Cho phép bật mic
        </button>

        <button id="unlockAllCamera">
          📷 Cho phép bật camera
        </button>

        <button id="lockRoom">
          🔒 Khóa phòng
        </button>

      </div>


      <!-- DANH SÁCH -->

      <div class="participants-list">

        <h4>
          Trong phòng
        </h4>

        <div
          id="participantsList"
        ></div>

      </div>

    </aside>


    <!-- =========================
         CHAT
    ========================== -->

    <aside
      id="chatPanel"
      class="chat hidden"
    >

      <div class="panel-header">

        <h3>
          💬 Trò chuyện
        </h3>

        <button
          id="closeChat"
        >
          ✕
        </button>

      </div>


      <div
        id="messages"
        class="messages"
      ></div>


      <form id="chatForm">

        <input
          id="chatInput"
          type="text"
          placeholder="Nhập tin nhắn..."
          autocomplete="off"
        >

        <button type="submit">
          Gửi
        </button>

      </form>

    </aside>

  </main>


  <!-- =========================
       THÔNG BÁO
  ========================== -->

  <div
    id="toast"
    class="toast hidden"
  ></div>


  <!-- SOCKET.IO -->

  <script src="/socket.io/socket.io.js"></script>

  <!-- APP -->

  <script src="app.js"></script>

</body>

</html>
